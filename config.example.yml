# ScannerIntel Node Configuration
# Copy to config.yml and fill in your details.
#
# Your API key and monitoring frequency are assigned automatically
# by the server when the node registers. You do NOT configure
# frequencies here -- the server picks the best coverage gap near you.
# State is stored in ~/.scannerintel/state.json.

server:
  url: https://scannerintel.com

# Optional: link this node to your ScannerIntel account for free premium
# email: you@example.com

node:
  device_index: 0           # RTL-SDR device index (run rtl_test to find yours)
  gain: 49                  # SDR gain in dB (0-49)
  sample_rate: 48000        # audio sample rate in Hz
  bias_tee: false           # enable bias tee for active antennas
  location:
    lat: null               # optional: your latitude (shown on coverage map)
    lon: null               # optional: your longitude
    description: null       # optional: "rooftop near CVG airport"
